<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

<h1> Inscription d'un nouveau client </h1>
<form>
<label> Nom: </label> 
<input type="texte" name="t1"> <br>
<br>
<label> Date de naissance </label>
<input type="date" id="date de naissance" name="d1"> <br>
<br>
<label> Age </label>
<input type="number" name="n1"> <br>
<br>
<label> Email </label>
<input type="email" id="email" name="e1"> <br>
<br>
<label> Mot de passe </label>
<input type="password" id="mdp" name="mdp"> <br>
<br>
<label> Numéro de permis: </label>
<input type="texte" id="permis" name="permis"> <br>
<br>
<p> Préférence de voiture: </p>
<label> Automatique </label>
<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique"> <br>
<label> Manuelle </label>
<input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle"> <br>
<br>
<label> Adresse du client: </label>
<textarea id="adresse" name="adresse" rows="4" cols="30"></textarea> <br>
<br>
<label> commentaire </label>
<textarea cols="20" rows="20"></textarea> <br>
<br>
<button> Enregistrer </button>
<button> Annuler </button>




</body>
</html>
